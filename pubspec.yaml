name: cystem
description: CYSTEM — a private, customizable personal AI command center for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.5.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  local_auth: ^3.0.2
  flutter_markdown: ^0.7.7+1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  mime: ^2.0.0
  syncfusion_flutter_pdf: ^34.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
